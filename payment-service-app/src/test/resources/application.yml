spring:
  datasource:
    url: jdbc:h2:mem:payment-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true                  # Показывать SQL-запросы в консоли
    properties:
      hibernate:
        format_sql: true            # Форматировать SQL для читаемости
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  kafka:
    listener:
      auto-startup: false
    consumer:
      group-id: test-group
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topics:
      xpayment-adapter:
        response: test-topic